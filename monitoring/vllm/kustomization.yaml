apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - namespace.yaml
  - vllm-podmonitor.yaml
  - vllm-prometheusrule.yaml
configMapGenerator:
  - name: dcgm-exporter-metrics
    files:
      - core-metrics.csv=dcgm-core-metrics.csv
  - name: seldon-vllm-dashboard
    files:
      - seldon-vllm-overview.json
    options:
      labels:
        grafana_dashboard: "1"
generatorOptions:
  disableNameSuffixHash: true
