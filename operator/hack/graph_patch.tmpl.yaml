- op: replace
  path: /spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/predictors/items/properties/graph
  value: 
    properties:
      children:
        items: {}
        type: array
      endpoint:
        properties:
          grpcPort:
            format: int32
            type: integer
          httpPort:
            format: int32
            type: integer
          service_host:
            type: string
          service_port:
            format: int32
            type: integer
          type:
            type: string
        type: object
      storageInitializerImage:
        type: string
      envSecretRefName:
        type: string
      implementation:
        type: string
      logger:
        description: Request/response  payload logging. v2alpha1
          feature that is added to v1 for backwards compatibility
          while v1 is the storage version.
        properties:
          mode:
            description: What payloads to log
            type: string
          url:
            description: URL to send request logging CloudEvents
            type: string
        type: object
      methods:
        items:
          type: string
        type: array
      modelUri:
        type: string
      name:
        type: string
      parameters:
        items:
          properties:
            name:
              type: string
            type:
              type: string
            value:
              type: string
          required:
          - name
          - type
          - value
          type: object
        type: array
      serviceAccountName:
        type: string
      type:
        type: string
      vllm:
        description: VLLMSpec defines the typed runtime configuration for a VLLM_SERVER node.
        properties:
          engine:
            description: VLLMEngineSpec defines stable vLLM engine settings managed by the Operator.
            properties:
              enforceEager:
                type: boolean
              gpuMemoryUtilizationPercent:
                format: int32
                maximum: 100
                minimum: 1
                type: integer
              maxModelLen:
                format: int32
                minimum: 1
                type: integer
              maxNumSeqs:
                format: int32
                minimum: 1
                type: integer
              port:
                format: int32
                maximum: 65535
                minimum: 1
                type: integer
            type: object
          gpu:
            description: VLLMGPUSpec defines the extended GPU resource requested by the vLLM backend.
            properties:
              count:
                format: int32
                minimum: 1
                type: integer
              resourceName:
                minLength: 1
                type: string
            type: object
          image:
            description: Image is the vLLM backend container image.
            minLength: 1
            type: string
          modelSource:
            description: VLLMModelSource describes where the vLLM backend reads model files from.
            properties:
              hostPath:
                description: VLLMHostPathSource mounts a model directory from the Kubernetes node.
                properties:
                  path:
                    minLength: 1
                    type: string
                required:
                - path
                type: object
              pvc:
                description: VLLMPVCSource mounts a pre-populated PersistentVolumeClaim from the workload namespace.
                properties:
                  claimName:
                    minLength: 1
                    type: string
                required:
                - claimName
                type: object
            type: object
          runtimeClassName:
            description: RuntimeClassName selects the Kubernetes runtime used by the generated Pod.
            minLength: 1
            type: string
          servedModelName:
            description: ServedModelName is the model name exposed by the vLLM OpenAI-compatible API.
            minLength: 1
            type: string
        required:
        - servedModelName
        type: object
    required:
    - name
    type: object
  
